name: Plutus v2 checks
on:
  push:
    paths: ['v2/**', '.github/workflows/plutus-v2.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/plutus-v2.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r research/requirements.txt
        working-directory: v2/apps/api
      - run: python -m pytest tests -q
        working-directory: v2/apps/api
        env:
          PYTHONPATH: .
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: v2/apps/web
      - run: npm run build
        working-directory: v2/apps/web
